# ===================================================================
# =         MAIN APPLICATION CONFIGURATION                        =
# ===================================================================
server.port=8080
spring.profiles.active=dev

# ===================================================================
# =         POSTGRESQL DATASOURCE CONFIGURATION                   =
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_db
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# =         JPA & HIBERNATE CONFIGURATION                         =
# ===================================================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# =         SQL INITIALIZATION                                    =
# ===================================================================
spring.sql.init.mode=always

# ===================================================================
# =         JWT CONFIGURATION                                     =
# ===================================================================
jwt.expiration=${JWT_EXPIRATION:86400000} # 24 hours

# ===================================================================
# =         VNPAY CONFIGURATION                                   =
# ===================================================================
vnpay.tmn_code=YOUR_TMN_CODE
vnpay.secret_key=YOUR_SECRET_KEY
vnpay.pay_url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
# This is the URL the user is sent back to after payment. It MUST be a frontend URL.
# It will be overridden by the FRONTEND_PAYMENT_REDIRECT_URL environment variable if set.
vnpay.return_url=http://localhost:3000/payment-result

# ===================================================================
# =         EXTERNAL API CONFIGURATION                            =
# ===================================================================
exchange-rate.api.url=https://v6.exchangerate-api.com/v6/YOUR_API_KEY/latest/USD
