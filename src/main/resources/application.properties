# ===================================================================
# =         MAIN APPLICATION CONFIGURATION                        =
# ===================================================================
server.port=${PORT:8080}
spring.profiles.active=dev

# ===================================================================
# =         POSTGRESQL DATASOURCE CONFIGURATION                   =
# ===================================================================
# Database connection settings - Fetched from Environment Variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# =         JPA & HIBERNATE CONFIGURATION                         =
# ===================================================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# =         SQL INITIALIZATION                                    =
# ===================================================================
spring.sql.init.mode=always

# ===================================================================
# =         JWT CONFIGURATION                                     =
# ===================================================================
jwt.expiration=${JWT_EXPIRATION:86400000} # 24 hours

# ===================================================================
# =         VNPAY CONFIGURATION                                   =
# ===================================================================
vnpay.tmn_code=YOUR_TMN_CODE
vnpay.secret_key=YOUR_SECRET_KEY
vnpay.pay_url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
# This is the URL the user is sent back to after payment. It MUST be a frontend URL.
# It will be overridden by the FRONTEND_PAYMENT_REDIRECT_URL environment variable if set.
vnpay.return_url=http://localhost:3000/payment-result

# ===================================================================
# =         EXTERNAL API CONFIGURATION                            =
# ===================================================================
exchange-rate.api.url=https://v6.exchangerate-api.com/v6/6f030a39a04eee6bb65ed9f8/latest/USD

supabase.url=${SUPABASE_URL}
supabase.service-key=${SUPABASE_SERVICE_KEY}
